<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Derrick &amp; Jolene</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<style>
  :root {
    --ivory: #f8f4ea;
    --ivory-2: #f1ebdc;
    --ink: #4a4137;
    --ink-soft: #8a7d6b;
    --gold: #b08d3e;
    --gold-deep: #8f6f2a;
    --champagne: #d9bd7f;
    --sage: #8a9b7e;
    --blush: #d9b8a6;
    --card: #fffdf8;
    --line: rgba(176, 141, 62, 0.28);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Jost', system-ui, sans-serif;
    background:
      radial-gradient(1000px 480px at 12% 0%, rgba(217, 184, 166, 0.20), transparent 60%),
      radial-gradient(1000px 520px at 88% 8%, rgba(138, 155, 126, 0.16), transparent 60%),
      radial-gradient(1400px 700px at 50% 110%, rgba(217, 189, 127, 0.18), transparent 60%),
      var(--ivory);
    color: var(--ink);
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    padding: 34px 20px 60px;
  }
  /* Four Seasons ballroom backdrop, softened under an ivory wash */
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -1;
    background: url('ballroom.jpg') center 28% / cover no-repeat;
    filter: blur(3px) saturate(0.92);
  }
  body::after {
    content: ""; position: fixed; inset: 0; z-index: -1;
    background: linear-gradient(rgba(248, 244, 234, 0.84), rgba(243, 236, 222, 0.92));
  }

  /* ---------- header ---------- */
  header { text-align: center; }
  .names {
    font-family: 'Pinyon Script', cursive;
    font-size: clamp(52px, 9vw, 96px);
    line-height: 1.05; color: var(--ink);
  }
  .names .amp { color: var(--gold); font-size: 0.72em; }
  .rule { display: flex; align-items: center; gap: 14px; margin: 14px auto 12px; max-width: 420px; }
  .rule::before, .rule::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--gold), transparent); }
  .rule span { color: var(--gold); font-size: 13px; }
  /* couple photos as a faded full-page backdrop */
  .couple-bg { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
  .couple-bg img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; object-position: center 18%;
    opacity: 0; transition: opacity 1.4s ease;
    filter: saturate(0.85);
  }
  .couple-bg img.show { opacity: 0.22; }

  .progress { display: flex; gap: 34px; margin: 26px 0 4px; }
  .progress div { text-align: center; }
  .progress b {
    font-family: 'Cormorant Garamond', serif; font-weight: 700;
    font-size: 34px; color: var(--ink); display: block; line-height: 1;
  }
  .progress span { font-size: 10px; letter-spacing: 0.28em; text-transform: uppercase; color: var(--ink-soft); }

  main {
    width: 100%; max-width: 1180px;
    display: grid; grid-template-columns: 1fr 1.12fr; gap: 26px;
    margin-top: 22px; align-items: start;
  }
  @media (max-width: 920px) { main { grid-template-columns: 1fr; } }

  .panel {
    background: var(--card);
    border: 1px solid var(--line); border-radius: 6px;
    padding: 32px 30px; position: relative;
    box-shadow: 0 18px 50px rgba(120, 95, 40, 0.10);
  }
  .panel::before {
    content: ""; position: absolute; inset: 8px;
    border: 1px solid rgba(176, 141, 62, 0.18); border-radius: 3px;
    pointer-events: none;
  }
  /* backlit-coffer glow along the top edge, like the ballroom ceiling */
  .panel::after {
    content: ""; position: absolute; top: -1px; left: 12%; right: 12%; height: 4px;
    border-radius: 0 0 8px 8px;
    background: linear-gradient(90deg, transparent, rgba(217, 189, 127, 0.9), transparent);
    filter: blur(1px); pointer-events: none;
  }

  /* ---------- stage ---------- */
  .stage { text-align: center; }
  .draw-label {
    font-family: 'Cormorant Garamond', serif; font-style: italic;
    font-size: 20px; color: var(--ink-soft); min-height: 28px; margin-bottom: 6px;
  }
  .ball-wrap { display: flex; justify-content: center; align-items: center; min-height: 300px; margin: 8px 0 4px; }
  .ball {
    width: 268px; height: 268px; border-radius: 50%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 16%, #fffdf8 0%, #faf5e8 34%, #f0e3c8 68%, #e0cda4 100%);
    border: 2px solid var(--gold);
    outline: 1px solid rgba(176,141,62,0.4); outline-offset: 7px;
    box-shadow: 0 22px 60px rgba(140, 110, 50, 0.22), inset 0 -14px 34px rgba(176,141,62,0.12),
      0 0 0 12px rgba(138, 155, 126, 0.10);
    color: var(--ink); position: relative;
  }
  .ball .num {
    font-family: 'Cormorant Garamond', serif; font-weight: 700;
    font-size: 118px; line-height: 0.8;
    transform: translateY(-0.24em); /* measured: Cormorant figures sit low in the line box */
    font-variant-numeric: tabular-nums;
  }
  .ball.idle { border-style: dashed; box-shadow: none; }
  .ball.idle .num { font-size: 72px; color: var(--ink-soft); font-style: italic; }
  .ball.rolling { animation: wobble 0.32s ease-in-out infinite; }
  @keyframes wobble { 0%,100% { transform: rotate(-4deg) scale(1); } 50% { transform: rotate(4deg) scale(1.03); } }
  .ball.rolling .num.fast { filter: blur(2px); transform: translateY(-0.24em) scale(0.94); }
  .ball .num { transition: filter 0.2s, transform 0.2s; }
  .ball.land { animation: pop 0.5s cubic-bezier(0.2, 1.6, 0.4, 1); }
  @keyframes pop { 0% { transform: scale(0.82); } 60% { transform: scale(1.06); } 100% { transform: scale(1); } }
  .ball.land::after {
    content: ""; position: absolute; inset: -10px; border-radius: 50%;
    border: 3px solid var(--gold);
    animation: ringExpand 0.9s ease-out forwards; pointer-events: none;
  }
  @keyframes ringExpand {
    from { transform: scale(0.9); opacity: 0.9; }
    to { transform: scale(1.35); opacity: 0; }
  }
  /* animated edge glow around the main ball */
  .ball-wrap { position: relative; }
  .ball-wrap.glow::before {
    content: ""; position: absolute; top: 50%; left: 50%;
    width: 304px; height: 304px; margin: -152px 0 0 -152px; border-radius: 50%;
    background: conic-gradient(from 0deg, transparent 0deg, transparent 290deg, rgba(217,189,127,0.9) 325deg, rgba(255,252,240,0.95) 345deg, transparent 360deg);
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 7px), #000 calc(100% - 6px));
    mask: radial-gradient(farthest-side, transparent calc(100% - 7px), #000 calc(100% - 6px));
    animation: ringSpin 5s linear infinite;
    pointer-events: none;
  }
  .ball-wrap.glow::after {
    content: ""; position: absolute; top: 50%; left: 50%;
    width: 284px; height: 284px; margin: -142px 0 0 -142px; border-radius: 50%;
    box-shadow: 0 0 46px 12px rgba(217,189,127,0.35);
    animation: glowPulse 2.6s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes ringSpin { to { transform: rotate(360deg); } }
  @keyframes glowPulse { 0%,100% { opacity: 0.5; } 50% { opacity: 1; } }
  /* settings */
  .gear-btn {
    position: fixed; top: 18px; right: 20px; z-index: 60;
    width: 42px; height: 42px; border-radius: 50%;
    background: rgba(255,253,248,0.9); border: 1px solid var(--line);
    color: var(--ink-soft); font-size: 19px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 18px rgba(120,95,40,0.15); transition: color 0.15s, border-color 0.15s, transform 0.3s;
  }
  .gear-btn:hover { color: var(--gold-deep); border-color: var(--gold); transform: rotate(40deg); }
  .settings-panel {
    position: fixed; top: 70px; right: 20px; z-index: 60; width: 288px;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: 0 24px 60px rgba(120,95,40,0.28); padding: 18px 22px 14px;
    display: none; text-align: left;
  }
  .settings-panel.open { display: block; animation: panelIn 0.18s ease; }
  @keyframes panelIn { from { opacity: 0; transform: translateY(-8px); } }
  .settings-panel h4 { font-family: 'Pinyon Script', cursive; font-size: 28px; font-weight: 400; margin-bottom: 6px; }
  .set-row { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-top: 1px solid rgba(176,141,62,0.15); font-size: 14px; }
  .set-row label.lbl { flex: none; }
  .set-row .val { font-family: 'Cormorant Garamond', serif; font-weight: 700; font-size: 17px; color: var(--gold-deep); min-width: 42px; text-align: right; margin-left: auto; }
  .set-row input[type="range"] { flex: 1; accent-color: var(--gold); min-width: 0; }
  .set-row .switch { margin-left: auto; }
  .switch { position: relative; width: 44px; height: 24px; flex: none; cursor: pointer; display: inline-block; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch .track { position: absolute; inset: 0; border-radius: 999px; background: rgba(176,141,62,0.28); transition: 0.2s; }
  .switch .track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fffdf8; box-shadow: 0 2px 5px rgba(0,0,0,0.2); transition: 0.2s; }
  .switch input:checked + .track { background: var(--gold); }
  .switch input:checked + .track::after { left: 23px; }

  .btn {
    font-family: 'Jost', sans-serif; font-weight: 600; letter-spacing: 0.24em; text-indent: 0.24em; text-transform: uppercase;
    border: none; cursor: pointer; border-radius: 999px;
    padding: 18px 58px; font-size: 15px; color: #fbf7ec;
    background: linear-gradient(135deg, #5a5145, #3f3a30);
    box-shadow: 0 12px 28px rgba(63, 58, 48, 0.28), inset 0 1px 0 rgba(255,255,255,0.15);
    transition: transform 0.12s ease, box-shadow 0.12s ease, opacity 0.2s;
  }
  .btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 16px 34px rgba(63,58,48,0.34), 0 0 0 3px rgba(176,141,62,0.25); }
  .btn:active:not(:disabled) { transform: translateY(0) scale(0.98); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .hint { margin-top: 12px; font-size: 12px; color: var(--ink-soft); letter-spacing: 0.06em; }
  .hint kbd {
    border: 1px solid var(--line); border-radius: 6px; padding: 1px 8px;
    font-family: inherit; font-size: 11px; background: rgba(176,141,62,0.08);
  }

  /* ---------- override ---------- */
  .override { margin-top: 26px; border-top: 1px solid var(--line); padding-top: 22px; text-align: left; }
  .override h3 {
    font-family: 'Pinyon Script', cursive; font-size: 30px; font-weight: 400;
    color: var(--ink); margin-bottom: 4px;
  }
  .override p { font-size: 13.5px; color: var(--ink-soft); margin-bottom: 14px; line-height: 1.6; font-weight: 300; }
  .override-row { display: flex; gap: 10px; }
  .override-row input {
    flex: 1; background: var(--ivory); border: 1px solid var(--line); border-radius: 10px;
    color: var(--ink); font-size: 20px; font-weight: 600; text-align: center;
    padding: 12px; outline: none; font-family: 'Cormorant Garamond', serif; min-width: 0;
  }
  .override-row input:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(176,141,62,0.14); }
  .override-row button {
    border-radius: 10px; cursor: pointer; padding: 0 24px;
    background: transparent; color: var(--gold-deep);
    border: 1px solid var(--gold); font-weight: 600; font-size: 13px; letter-spacing: 0.08em;
    font-family: 'Jost', sans-serif; text-transform: uppercase; transition: all 0.15s;
  }
  .override-row button:hover { background: var(--gold); color: #fffdf8; }
  .flash { font-size: 13px; margin-top: 10px; min-height: 19px; font-style: italic; font-family: 'Cormorant Garamond', serif; font-size: 16px; }
  .flash.err { color: #b0492f; }
  .flash.ok { color: #6d7f5f; }

  .recent { margin-top: 22px; text-align: left; }
  .recent h3 { font-family: 'Pinyon Script', cursive; font-size: 28px; font-weight: 400; margin-bottom: 10px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; min-height: 42px; }
  .chip {
    display: inline-flex; align-items: center; gap: 8px;
    background: #fffdf8; border: 1px solid var(--line);
    border-radius: 999px; padding: 6px 15px 6px 7px;
    font-family: 'Cormorant Garamond', serif; font-weight: 700; font-size: 18px;
    animation: chipIn 0.3s ease; color: var(--ink);
  }
  @keyframes chipIn { from { transform: scale(0.7); opacity: 0; } }
  .chip .bl {
    width: 28px; height: 28px; border-radius: 50%;
    background: linear-gradient(135deg, var(--champagne), var(--gold));
    color: #fffdf8; font-size: 12px; font-family: 'Jost', sans-serif;
    display: flex; align-items: center; justify-content: center; font-weight: 600;
    letter-spacing: 0;
  }
  .chip.offline { border-style: dashed; }
  .chip.offline .bl { background: var(--sage); }
  .chip.latest {
    background: linear-gradient(135deg, var(--champagne), var(--gold-deep));
    border-color: transparent; color: #fffdf8;
    box-shadow: 0 6px 18px rgba(176,141,62,0.45);
    animation: chipIn 0.3s ease, latestGlow 2s ease-in-out 0.3s infinite;
  }
  .chip.latest .bl { background: rgba(255,253,248,0.28); color: #fffdf8; }
  @keyframes latestGlow {
    0%, 100% { box-shadow: 0 6px 18px rgba(176,141,62,0.45); }
    50% { box-shadow: 0 6px 30px rgba(176,141,62,0.8); }
  }
  .newest {
    font-family: 'Jost', sans-serif; font-size: 10px; letter-spacing: 0.24em; text-transform: uppercase;
    color: var(--ink-soft); vertical-align: middle; margin-left: 10px;
  }
  .empty-note { color: var(--ink-soft); font-size: 14px; font-style: italic; font-family: 'Cormorant Garamond', serif; }

  /* ---------- board ---------- */
  .board-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
  .board-head h3 { font-family: 'Pinyon Script', cursive; font-size: 30px; font-weight: 400; }
  .btn-ghost {
    background: transparent; color: var(--ink-soft); border: 1px solid var(--line);
    box-shadow: none; padding: 10px 26px; font-size: 12px; letter-spacing: 0.2em;
  }
  .btn-ghost:hover:not(:disabled) { color: var(--gold-deep); border-color: var(--gold); box-shadow: none; transform: none; }
  .board { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .col { display: flex; flex-direction: column; gap: 7px; }
  .col-head {
    width: 100%; aspect-ratio: 1;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Cormorant Garamond', serif; font-weight: 700; font-size: 30px; line-height: 1;
    color: #fffdf8; margin-bottom: 6px;
    background: linear-gradient(135deg, var(--champagne), var(--gold-deep));
    border-radius: 50%;
    box-shadow: 0 4px 12px rgba(176,141,62,0.35), inset 0 2px 5px rgba(255,255,255,0.4);
    text-shadow: 0 1px 2px rgba(120, 85, 20, 0.4);
  }
  .cell {
    aspect-ratio: 1; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    text-align: center; line-height: 1; font-variant-numeric: tabular-nums;
    font-family: 'Cormorant Garamond', serif; font-size: 16px; font-weight: 600; color: var(--ink-soft);
    background: transparent; border: 1px dashed rgba(176,141,62,0.25);
    transition: all 0.25s ease;
  }
  .cell.called {
    background: radial-gradient(circle at 35% 28%, #fffefb 0%, #f8f1de 45%, #ead9b2 80%, #d9c193 100%);
    color: var(--ink); font-weight: 700; border: 2px solid var(--gold);
    box-shadow: 0 3px 10px rgba(176,141,62,0.35), inset 0 -4px 8px rgba(176,141,62,0.15), inset 0 3px 6px rgba(255,255,255,0.6);
    transform: scale(1.08);
  }
  .cell.latest { animation: latestPulse 1.8s ease-in-out infinite; outline: 2px solid var(--gold-deep); outline-offset: 2px; }
  @keyframes latestPulse {
    0%, 100% { box-shadow: 0 4px 14px rgba(176,141,62,0.35); }
    50% { box-shadow: 0 4px 28px rgba(176,141,62,0.7); }
  }

</style>
</head>
<body>
<button class="gear-btn" id="gearBtn" title="Settings">&#9881;</button>
<div class="settings-panel" id="settingsPanel">
  <h4>Settings</h4>
  <div class="set-row">
    <label class="lbl" for="durRange">Draw animation</label>
    <input type="range" id="durRange" min="500" max="5000" step="100" />
    <span class="val" id="durVal"></span>
  </div>
  <div class="set-row"><label class="lbl">Tick sound</label><label class="switch"><input type="checkbox" id="setSound" /><span class="track"></span></label></div>
  <div class="set-row"><label class="lbl">Confetti</label><label class="switch"><input type="checkbox" id="setConfetti" /><span class="track"></span></label></div>
  <div class="set-row"><label class="lbl">Ball glow</label><label class="switch"><input type="checkbox" id="setGlow" /><span class="track"></span></label></div>
  <div class="set-row"><label class="lbl">Photo backdrop</label><label class="switch"><input type="checkbox" id="setPhotos" /><span class="track"></span></label></div>
</div>

<div class="couple-bg" aria-hidden="true">
  <img id="coupleA" class="show" src="couple-1.jpg" alt="" />
  <img id="coupleB" src="couple-2.jpg" alt="" />
</div>

<header>
  <div class="names">Derrick <span class="amp">&amp;</span> Jolene</div>
  <div class="rule"><span>✦</span></div>
</header>

<div class="progress">
  <div><b id="calledCount">0</b><span>Called</span></div>
  <div><b id="leftCount">75</b><span>Remaining</span></div>
</div>

<main>
  <section class="panel stage">
    <div class="draw-label" id="drawLabel">&nbsp;</div>
    <div class="ball-wrap">
      <div class="ball idle" id="ball">
        <div class="num" id="ballNum">?</div>
      </div>
    </div>
    <button class="btn" id="drawBtn">Draw Number</button>
    <div class="hint">or press <kbd>Space</kbd></div>

    <div class="override">
      <h3>Called offline?</h3>
      <p>Numbers drawn off-screen can be entered here. They are marked as called and cannot be drawn again.</p>
      <div class="override-row">
        <input id="overrideInput" type="number" min="1" max="75" placeholder="1 – 75" inputmode="numeric" />
        <button id="overrideBtn">Mark called</button>
      </div>
      <div class="flash" id="flash"></div>
    </div>

    <div class="recent">
      <h3>Recent calls <span class="newest">newest first</span></h3>
      <div class="chips" id="chips"><span class="empty-note">Nothing called yet.</span></div>
    </div>
  </section>

  <section class="panel">
    <div class="board-head">
      <h3>Bingo Card</h3>
      <button class="btn btn-ghost" id="resetBtn">New game</button>
    </div>
    <div class="board" id="board"></div>
  </section>
</main>

<script>
(function () {
  'use strict';
  var STORE_KEY = 'wedding-bingo-v1';
  var LETTERS = ['B', 'I', 'N', 'G', 'O'];
  var TOTAL = 75;

  var state = { called: [], current: null, offline: {} };
  try {
    var saved = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
    if (saved && Array.isArray(saved.called)) state = saved;
  } catch (e) { /* fresh start */ }

  var ball = document.getElementById('ball');
  var ballNum = document.getElementById('ballNum');
  var drawBtn = document.getElementById('drawBtn');
  var drawLabel = document.getElementById('drawLabel');
  var board = document.getElementById('board');
  var chips = document.getElementById('chips');
  var calledCount = document.getElementById('calledCount');
  var leftCount = document.getElementById('leftCount');
  var overrideInput = document.getElementById('overrideInput');
  var overrideBtn = document.getElementById('overrideBtn');
  var flash = document.getElementById('flash');
  var resetBtn = document.getElementById('resetBtn');
  var coupleA = document.getElementById('coupleA');
  var coupleB = document.getElementById('coupleB');
  var photoFlip = false;
  function swapPhoto() {
    if (!settings.photos) return;
    photoFlip = !photoFlip;
    coupleA.classList.toggle('show', !photoFlip);
    coupleB.classList.toggle('show', photoFlip);
  }

  function letterFor(n) { return LETTERS[Math.ceil(n / 15) - 1]; }
  function remaining() {
    var out = [];
    for (var i = 1; i <= TOTAL; i++) if (state.called.indexOf(i) === -1) out.push(i);
    return out;
  }
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {}
  }

  var cells = {};
  (function buildBoard() {
    for (var c = 0; c < 5; c++) {
      var col = document.createElement('div');
      col.className = 'col';
      var head = document.createElement('div');
      head.className = 'col-head';
      head.textContent = LETTERS[c];
      col.appendChild(head);
      for (var r = 1; r <= 15; r++) {
        var n = c * 15 + r;
        var cell = document.createElement('div');
        cell.className = 'cell';
        cell.textContent = n;
        col.appendChild(cell);
        cells[n] = cell;
      }
      board.appendChild(col);
    }
  })();

  function render() {
    for (var n = 1; n <= TOTAL; n++) {
      var cell = cells[n];
      var isCalled = state.called.indexOf(n) !== -1;
      cell.classList.toggle('called', isCalled);
      cell.classList.toggle('latest', isCalled && n === state.current);
    }
    calledCount.textContent = state.called.length;
    leftCount.textContent = TOTAL - state.called.length;
    chips.innerHTML = '';
    if (!state.called.length) {
      chips.innerHTML = '<span class="empty-note">Nothing called yet.</span>';
    } else {
      state.called.slice(-10).reverse().forEach(function (n, i) {
        var chip = document.createElement('span');
        chip.className = 'chip' + (state.offline[n] ? ' offline' : '') + (i === 0 ? ' latest' : '');
        var bl = document.createElement('span');
        bl.className = 'bl';
        bl.textContent = letterFor(n);
        chip.appendChild(bl);
        chip.appendChild(document.createTextNode(n));
        chips.appendChild(chip);
      });
    }
    if (state.current == null) {
      ball.classList.add('idle');
      ballNum.textContent = '?';
      drawLabel.textContent = '\u00a0';
      document.title = 'Derrick & Jolene';
    } else {
      ball.classList.remove('idle');
      ballNum.textContent = state.current;
      document.title = letterFor(state.current) + ' ' + state.current + ' · Derrick & Jolene';
    }
    var pool = remaining();
    drawBtn.disabled = pool.length === 0;
    drawBtn.textContent = pool.length === 0 ? 'All called!' : 'Draw Number';
    save();
  }

  function goldConfetti(big) {
    if (!settings.confetti || typeof confetti !== 'function') return;
    confetti({
      particleCount: big ? 150 : 60,
      spread: big ? 90 : 60,
      origin: { y: 0.55 },
      colors: ['#d9bd7f', '#b08d3e', '#f8f4ea', '#d9b8a6', '#8a9b7e', '#fffdf8'],
      disableForReducedMotion: true
    });
  }

  function markCalled(n, isOffline) {
    state.called.push(n);
    if (isOffline) state.offline[n] = true;
    state.current = n;
    render();
  }

  var drawing = false;

  /* settings */
  var SETTINGS_KEY = 'wedding-bingo-settings';
  var settings = { duration: 2400, sound: true, confetti: true, glow: true, photos: true };
  try {
    var _s = JSON.parse(localStorage.getItem(SETTINGS_KEY) || 'null');
    if (_s) for (var k in settings) if (typeof _s[k] !== 'undefined') settings[k] = _s[k];
  } catch (e) {}
  function saveSettings() {
    try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); } catch (e) {}
  }

  /* soft mechanical tick, like a real draw machine */
  var audioCtx = null;
  function tick(freq) {
    if (!settings.sound) return;
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      var o = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      o.type = 'sine';
      o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.12, audioCtx.currentTime + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.07);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime + 0.09);
    } catch (e) {}
  }
  function applySettings() {
    document.getElementById('durRange').value = settings.duration;
    document.getElementById('durVal').textContent = (settings.duration / 1000).toFixed(1) + 's';
    document.getElementById('setSound').checked = settings.sound;
    document.getElementById('setConfetti').checked = settings.confetti;
    document.getElementById('setGlow').checked = settings.glow;
    document.getElementById('setPhotos').checked = settings.photos;
    document.querySelector('.ball-wrap').classList.toggle('glow', settings.glow);
    document.querySelector('.couple-bg').style.display = settings.photos ? '' : 'none';
  }
  var gearBtn = document.getElementById('gearBtn');
  var settingsPanel = document.getElementById('settingsPanel');
  gearBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    settingsPanel.classList.toggle('open');
  });
  document.addEventListener('click', function (e) {
    if (settingsPanel.classList.contains('open') && !settingsPanel.contains(e.target)) {
      settingsPanel.classList.remove('open');
    }
  });
  document.getElementById('durRange').addEventListener('input', function () {
    settings.duration = parseInt(this.value, 10);
    document.getElementById('durVal').textContent = (settings.duration / 1000).toFixed(1) + 's';
    saveSettings();
  });
  [['setSound', 'sound'], ['setConfetti', 'confetti'], ['setGlow', 'glow'], ['setPhotos', 'photos']].forEach(function (pair) {
    document.getElementById(pair[0]).addEventListener('change', function () {
      settings[pair[1]] = this.checked;
      saveSettings();
      applySettings();
    });
  });
  applySettings();

  function draw() {
    if (drawing) return;
    var pool = remaining();
    if (!pool.length) return;
    var finalNum = pool[Math.floor(Math.random() * pool.length)];
    drawing = true;
    drawBtn.disabled = true;
    ball.classList.remove('idle', 'land');
    ball.classList.add('rolling');
    ballNum.classList.add('fast');
    drawLabel.textContent = 'Drawing…';
    var start = Date.now();
    var dur = settings.duration;
    var lastTick = 0;
    (function tickFrame() {
      var p = Math.min((Date.now() - start) / dur, 1);
      var tmp = pool[Math.floor(Math.random() * pool.length)];
      ballNum.textContent = tmp;
      if (p > 0.55) ballNum.classList.remove('fast'); /* motion blur settles */
      var now = Date.now();
      if (now - lastTick > 60 + Math.pow(p, 2.5) * 500) {
        lastTick = now;
        tick(900 - p * 350); /* pitch drops as the ball slows */
      }
      if (p < 1) {
        setTimeout(tickFrame, 40 + Math.pow(p, 3) * 380); /* fast spin, long slow-down */
      } else {
        ball.classList.remove('rolling');
        ball.classList.add('land');
        markCalled(finalNum, false);
        drawLabel.textContent = 'Number ' + state.called.length + ' of ' + TOTAL;
        tick(1400); /* little chime on landing */
        goldConfetti(true);
        swapPhoto();
        drawing = false;
        render();
      }
    })();
  }

  function showFlash(msg, ok) {
    flash.textContent = msg;
    flash.className = 'flash ' + (ok ? 'ok' : 'err');
    setTimeout(function () { flash.textContent = ''; flash.className = 'flash'; }, 3500);
  }
  function doOverride() {
    var raw = overrideInput.value.trim();
    var n = parseInt(raw, 10);
    if (!/^\d+$/.test(raw) || n < 1 || n > 75) {
      showFlash('Please enter a whole number between 1 and 75.', false);
      return;
    }
    if (state.called.indexOf(n) !== -1) {
      showFlash(letterFor(n) + ' ' + n + ' was already called.', false);
      return;
    }
    markCalled(n, true);
    drawLabel.textContent = 'Marked from an offline draw';
    showFlash(letterFor(n) + ' ' + n + ' marked as called.', true);
    overrideInput.value = '';
    overrideInput.focus();
  }

  drawBtn.addEventListener('click', draw);
  overrideBtn.addEventListener('click', doOverride);
  overrideInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') doOverride();
  });
  document.addEventListener('keydown', function (e) {
    if (e.code === 'Space' && document.activeElement !== overrideInput && !drawing) {
      e.preventDefault();
      draw();
    }
  });
  resetBtn.addEventListener('click', function () {
    if (state.called.length && confirm('Start a new game? This clears all called numbers.')) {
      state = { called: [], current: null, offline: {} };
      render();
    }
  });

  render();
})();
</script>
</body>
</html>
